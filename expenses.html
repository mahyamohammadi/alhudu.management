<!DOCTYPE html>
<html>
<head>
    <title>AL HUDU Expenses</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
    <h2>AL HUDU</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="sales.html">Sales</a>
    <a href="expenses.html">Expenses</a>
    <a>Staff Salary</a>
    <a>Cash Flow</a>
    <a>Reports</a>
</div>


<div class="main">

<h1>Expense Entry</h1>


<div class="card">

<label>Date</label>
<input type="date" id="expenseDate">


<label>Category</label>
<select id="expenseType">
    <option>Salary</option>
    <option>Rent</option>
    <option>Marketing</option>
    <option>Transportation</option>
    <option>Shop Supplies</option>
    <option>Other</option>
</select>


<label>Description</label>
<input type="text" id="expenseNote" placeholder="Expense details">


<label>Amount (AED)</label>
<input type="number" id="expenseAmount" placeholder="0">


<button id="saveExpense">Save Expense</button>

</div>


<h2>Expenses History</h2>

<table>

<thead>
<tr>
<th>Date</th>
<th>Category</th>
<th>Amount</th>
<th>Description</th>
</tr>
</thead>

<tbody id="expenseList">
</tbody>

</table>


</div>


<script type="module" src="expenses.js"></script>

</body>
</html>
