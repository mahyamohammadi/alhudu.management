<!DOCTYPE html>
<html>
<head>
    <title>AL HUDU Expenses</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
    <h2>AL HUDU</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="sales.html">Sales</a>
    <a href="expenses.html">Expenses</a>
    <a href="staff.html">Staff Salary</a>
    <a href="cashflow.html">Cash Flow</a>
    <a href="reports.html">Reports</a>

</div>


<div class="main">

<h1>Expenses Entry</h1>


<div class="card">

<label>Date</label>
<input type="date" id="expenseDate">


<label>Expense Type</label>
<input type="text" id="expenseType" placeholder="Rent, Purchase, Transport...">


<label>Amount (AED)</label>
<input type="number" id="expenseAmount" placeholder="0">


<label>Note</label>
<input type="text" id="expenseNote" placeholder="Optional">


<button id="saveExpense">Save Expense</button>

</div>



<h2>Expenses History</h2>


<table>

<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Amount</th>
<th>Note</th>
</tr>
</thead>


<tbody id="expenseList">

</tbody>

</table>


</div>


<script type="module" src="expenses.js"></script>


</body>
</html>
