<!DOCTYPE html>
<html>

<head>

<title>AL HUDU Reports</title>

<link rel="stylesheet" href="style.css">


<style>

.report-card{

background:white;
border-radius:16px;
padding:20px;
margin-top:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);

}


.report-line{

display:flex;
justify-content:space-between;
margin:10px 0;

}


.report-btn{

background:#d4af37;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;

}


</style>

</head>



<body>



<div class="sidebar">

<h2>AL HUDU</h2>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="sales.html">💰 Sales</a>
<a href="expenses.html">💸 Expenses</a>
<a href="staff.html">👨‍💼 Staff Payment</a>
<a href="cashflow.html">💵 Cash Flow</a>
<a href="reports.html">📊 Reports</a>
<a href="inventory.html">📦 Inventory</a>

</div>





<div class="main">


<h1>Reports</h1>




<div class="report-card">


<h2>Daily Report</h2>


<input type="date" id="dailyDate">


<button class="report-btn" id="dailyReport">

View Daily

</button>


<button class="report-btn" id="dailyPDF">

Export PDF

</button>


</div>








<div class="report-card">


<h2>Monthly Report</h2>


<select id="month">

<option value="1">January</option>
<option value="2">February</option>
<option value="3">March</option>
<option value="4">April</option>
<option value="5">May</option>
<option value="6">June</option>
<option value="7">July</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>

</select>


<input type="number" id="year" placeholder="Year">



<button class="report-btn" id="monthlyReport">

View Monthly

</button>


<button class="report-btn" id="monthlyPDF">

Export PDF

</button>


</div>









<div class="report-card">


<h2>Report Summary</h2>



<div id="reportResult">

Select a report

</div>



</div>





</div>




<script type="module" src="reports.js"></script>


</body>


</html>
